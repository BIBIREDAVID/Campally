<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline — Union</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f5f9;
    color: #171b2e;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #12131f; color: #edeefb; }
    .card { background: #191b2c; border-color: #2b2d47; }
    .muted { color: #8a8fb8; }
  }
  .card {
    max-width: 360px;
    text-align: center;
    background: #ffffff;
    border: 1px solid #e1e3f0;
    border-radius: 20px;
    padding: 32px 28px;
  }
  .badge {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #eaedff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 22px;
  }
  h1 { font-size: 17px; margin: 0 0 6px; }
  p.muted { color: #767ba0; font-size: 13.5px; line-height: 1.5; margin: 0 0 20px; }
  button {
    font: inherit;
    font-weight: 600;
    font-size: 13.5px;
    background: #3b5bfd;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">📡</div>
    <h1>You're offline</h1>
    <p class="muted">This page isn't cached and there's no connection right now. Anything you try to submit here won't go through until you're back online — nothing has been saved yet.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
